name: resume_generator
description: "Rasmiy ma'lumotnoma generatori — mobil ilova (Android/iOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP (multipart, PDF yuklab olish)
  dio: ^5.7.0
  # Kamera/galereyadan rasm
  image_picker: ^1.1.2
  # PDF'ni tashqi ilovada ochish
  open_filex: ^4.5.0
  # Qurilma papkalari (fayl saqlash)
  path_provider: ^2.1.4
  # PDF'ni ulashish (ixtiyoriy)
  share_plus: ^10.0.0
  # Video qo'llanma (serverdan stream)
  video_player: ^2.9.1
  # "Lora" serif shrift (veb bilan bir xil)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
